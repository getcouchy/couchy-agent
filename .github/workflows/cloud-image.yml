# Builds ghcr.io/getcouchy/couchy-comfyui, the image Couchy starts cloud GPUs
# from (cloud/README.md), and runs cloud/smoke.sh against it on the CPU. A
# pull request that changes the image builds and smokes it with read-only
# permissions. A release publishes it as :<version> through publish-image.yml,
# the only job that may write packages: release.yml does that when a version
# bump lands on main, and this workflow does it for a v<version> tag pushed by
# hand.
name: Cloud image

on:
  push:
    tags: ["v*"]
  # Not on a draft PR (the job's if); ready_for_review runs it when the draft
  # is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["cloud/**", "couchy_agent/**", "__init__.py", ".github/workflows/cloud-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/getcouchy/couchy-comfyui

jobs:
  image:
    if: github.ref_type != 'tag' && github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: cloud/ci.sh pins
      # couchyforms-helper is private: COUCHY_CLOUD_REPO_TOKEN can read it
      # (a fine-grained token with Contents: read on that repo).
      - uses: actions/checkout@v4
        with:
          repository: getcouchy/couchyforms-helper
          ref: ${{ steps.pins.outputs.helper }}
          token: ${{ secrets.COUCHY_CLOUD_REPO_TOKEN }}
          path: .build/couchyforms-helper
      - run: cloud/ci.sh build "${IMAGE}:${{ steps.pins.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-container-log
          path: smoke-container.log

  # A v* tag pushed by hand. Tags the release workflow makes (release.yml)
  # don't start this, since that workflow publishes the image itself.
  version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pins.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: cloud/ci.sh pins

  release:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
