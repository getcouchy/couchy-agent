# Builds ghcr.io/getcouchy/couchy-comfyui, the image Couchy starts cloud GPUs
# from (cloud/README.md), runs cloud/smoke.sh against it on the CPU, and on a
# release tag v<version> publishes it as :<version>. A pull request that
# changes the image builds and smokes it without publishing.
name: Cloud image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["cloud/**", "couchy_agent/**", "__init__.py", ".github/workflows/cloud-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/getcouchy/couchy-comfyui

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          version=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("couchy_agent/__init__.py").read()).group(1))')
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} doesn't match the agent's version ${version}" >&2
            exit 1
          fi
          helper=$(python3 -c 'import json; print(next(p["commit"] for p in json.load(open("cloud/manifest.json"))["packs"] if p["id"] == "comfyform-helper"))')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "helper=${helper}" >> "$GITHUB_OUTPUT"

      # couchyforms-helper is private: COUCHY_CLOUD_REPO_TOKEN is a token that
      # can read it (a fine-grained token with Contents: read on that repo).
      - uses: actions/checkout@v4
        with:
          repository: getcouchy/couchyforms-helper
          ref: ${{ steps.version.outputs.helper }}
          token: ${{ secrets.COUCHY_CLOUD_REPO_TOKEN }}
          path: .build/couchyforms-helper

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Build
        run: |
          docker build -f cloud/Dockerfile \
            --build-context couchyforms-helper=.build/couchyforms-helper \
            -t "${IMAGE}:${{ steps.version.outputs.version }}" .

      - name: Smoke
        run: cloud/smoke.sh "${IMAGE}:${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-container-log
          path: smoke-container.log

      - name: Publish
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${{ steps.version.outputs.version }}"
