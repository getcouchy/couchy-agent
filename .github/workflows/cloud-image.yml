# Builds ghcr.io/getcouchy/couchy-comfyui, the image Couchy starts cloud GPUs
# from (cloud/README.md), and runs cloud/smoke.sh against it on the CPU. A
# pull request that changes the image builds and smokes it with read-only
# permissions; a release tag v<version> does the same in its own job, which
# alone may write packages, and publishes it as :<version>.
name: Cloud image

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["cloud/**", "couchy_agent/**", "__init__.py", ".github/workflows/cloud-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/getcouchy/couchy-comfyui

jobs:
  image:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: cloud/ci.sh pins
      # couchyforms-helper is private: COUCHY_CLOUD_REPO_TOKEN can read it
      # (a fine-grained token with Contents: read on that repo).
      - uses: actions/checkout@v4
        with:
          repository: getcouchy/couchyforms-helper
          ref: ${{ steps.pins.outputs.helper }}
          token: ${{ secrets.COUCHY_CLOUD_REPO_TOKEN }}
          path: .build/couchyforms-helper
      - run: cloud/ci.sh build "${IMAGE}:${{ steps.pins.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-container-log
          path: smoke-container.log

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: cloud/ci.sh pins
      - uses: actions/checkout@v4
        with:
          repository: getcouchy/couchyforms-helper
          ref: ${{ steps.pins.outputs.helper }}
          token: ${{ secrets.COUCHY_CLOUD_REPO_TOKEN }}
          path: .build/couchyforms-helper
      - run: cloud/ci.sh build "${IMAGE}:${{ steps.pins.outputs.version }}"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-container-log
          path: smoke-container.log
      - name: Publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${IMAGE}:${{ steps.pins.outputs.version }}"
