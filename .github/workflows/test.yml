# The unit tests (README, "Test"), on every pull request and push to main.
# tests/test_comfyui.py skips here: it needs a ComfyUI checkout.
name: Test

on:
  # Not on a draft PR (the job's if); ready_for_review runs it when the draft
  # is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    if: github.event.pull_request.draft != true
    # GitHub's runners, never the getcouchy build pool: the repository is
    # public, so a pull request from a fork could run its code on a
    # self-hosted runner. A public repository's hosted minutes are free.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install aiohttp
      - run: python3 -m unittest discover -s tests -t .
