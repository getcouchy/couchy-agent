name: Agent sweep
# The check on the multi-provider agent protocol (getcouchy/swarm): frees a
# claim (a swarm/agent/<name> label) that lapsed or that two providers hold, and
# keeps the "Agent desk" issue current with what the agents are behind on. See
# getcouchy/couchy's docs/ci.md, "Agent sweep". This repository keeps a desk of
# its own (the open swarm/desk issue here), where its ticks heartbeat.
on:
  # GitHub starts scheduled runs when it has room: on 2026-11-10 this hourly
  # cron ran twice in seventeen hours. A push to main happens dozens of times
  # a day, so it is the real clock, and the cron is the backstop for quiet hours.
  push:
    branches: [main]
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log changes without making them
        type: boolean
        default: false

permissions:
  contents: read

# Every run is a full sweep, so a newer pending run can replace an older one.
concurrency:
  group: agent-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: read
      statuses: write
    steps:
      # The tools live in getcouchy/swarm (public); always its main, since the token can write.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: getcouchy/swarm
          ref: main
          path: swarm
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Sweep claims and write the Agent desk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Hours before each thing counts as overdue; repository variables override.
          CLAIM_MINUTES: ${{ vars.AGENT_CLAIM_MINUTES }}
          READY_HOURS: ${{ vars.AGENT_READY_HOURS }}
          REVIEW_HOURS: ${{ vars.AGENT_REVIEW_HOURS }}
          FIX_HOURS: ${{ vars.AGENT_FIX_HOURS }}
          HOLD_HOURS: ${{ vars.AGENT_HOLD_HOURS }}
          HEARTBEAT_HOURS: ${{ vars.AGENT_HEARTBEAT_HOURS }}
        run: node swarm/sweep.mjs

      # The event-driven workflow (agent-reviewed.yml) can miss a delivery;
      # this puts every open PR's `reviewed` status right again.
      - name: Refresh the reviewed status
        if: inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node swarm/reviewed.mjs
